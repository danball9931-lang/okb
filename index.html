<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0b0d">
<meta name="color-scheme" content="dark light">
<title>BLACK ANALYZER ｜ パチスロ 沖ドキ!BLACK 特殊モード考慮</title>
<style>
  :root{
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    --bg:#08090b;
    --panel:#111417;
    --panel-2:#151a1f;
    --line:#242a32;
    --line-2:#333c47;
    --ink:#e9edf3;
    --muted:#8b95a3;
    --gold:#d9a92c;
    --gold-2:#ffd76a;
    --cyan:#3ad6ff;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --grid:rgba(255,255,255,.022);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#eceef2;
      --panel:#ffffff;
      --panel-2:#f7f8fa;
      --line:#d8dce2;
      --line-2:#c2c8d1;
      --ink:#101318;
      --muted:#5f6873;
      --gold:#a97c0c;
      --gold-2:#c9962a;
      --cyan:#0a74c4;
      --shadow:0 8px 24px rgba(16,24,40,.10);
      --grid:rgba(16,24,40,.03);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 380px at 50% -160px, rgba(217,169,44,.18), transparent 70%),
      repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 3px),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
    font-size:16px;line-height:1.5;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
    min-height:100vh;
  }
  header{
    position:relative;
    background:linear-gradient(180deg,#0c0d10,#050506);
    border-bottom:1px solid #2a2410;
    padding:0 16px calc(10px + env(safe-area-inset-top));
    overflow:hidden;
  }
  header::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--gold),#fff2c2 45%,var(--gold) 100%);
  }
  header::after{
    content:"";position:absolute;top:0;right:-30px;width:120px;height:100%;
    background:linear-gradient(180deg,rgba(217,169,44,.5),rgba(217,169,44,0));
    transform:skewX(-22deg);pointer-events:none;
  }
  .header-inner{
    max-width:640px;margin:0 auto;
    padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:12px;position:relative;z-index:1;
  }
  .mark{width:46px;height:46px;flex:0 0 auto;filter:drop-shadow(0 0 8px rgba(217,169,44,.45))}
  .brand{min-width:0}
  .header-title{
    font-size:13px;font-weight:700;letter-spacing:.08em;color:#c9d1dc;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .header-sub{
    display:flex;align-items:baseline;gap:8px;
    font-family:var(--mono);font-size:20px;font-weight:800;letter-spacing:.08em;
    color:#fff;margin-top:1px;
  }
  .header-sub .slash{color:var(--gold-2)}
  .unit-line{
    max-width:640px;margin:9px auto 0;position:relative;z-index:1;
    display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:#6f7987;
  }
  .unit-line .dot{color:var(--gold-2)}
  .unit-line .live{display:inline-flex;align-items:center;gap:5px}
  .unit-line .live i{
    width:5px;height:5px;border-radius:50%;background:var(--gold-2);
    box-shadow:0 0 6px var(--gold-2);display:inline-block;
  }
  main{max-width:640px;margin:0 auto;padding:16px 16px 28px}
  .card{
    position:relative;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    padding:16px;margin-bottom:16px;
  }
  .card::before,.card::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none}
  .card::before{top:-1px;left:-1px;border-top:2px solid var(--gold);border-left:2px solid var(--gold)}
  .card::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold)}
  .card-tag{
    position:absolute;top:-9px;left:18px;
    background:var(--gold);color:#16130a;
    font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.16em;
    padding:2px 7px;
  }
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .field label{
    display:flex;align-items:center;gap:7px;
    font-size:12px;font-weight:700;color:var(--muted);
    margin-bottom:6px;letter-spacing:.02em;line-height:1.35;
  }
  .num{
    flex:0 0 auto;font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.08em;
    color:#16130a;background:var(--gold);padding:1px 4px;border-radius:1px;
  }
  select{
    -webkit-appearance:none;appearance:none;
    width:100%;font:inherit;font-size:15px;font-weight:600;color:var(--ink);
    border:1px solid var(--line-2);
    border-left:2px solid var(--gold);
    border-radius:1px;
    padding:11px 38px 11px 13px;
    background-color:var(--panel);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6' fill='none' stroke='%23d9a92c' stroke-width='2.4' stroke-linecap='square'/></svg>"),linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0));
    background-repeat:no-repeat,no-repeat;
    background-position:right 11px center,0 0;
    background-size:16px,100% 100%;
  }
  @media (prefers-color-scheme: light){
    select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 9l6 6 6-6' fill='none' stroke='%23a97c0c' stroke-width='2.4' stroke-linecap='square'/></svg>"),linear-gradient(180deg,rgba(16,24,40,.02),rgba(16,24,40,0));}
  }
  select:disabled{opacity:.4}
  select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,169,44,.22)}
  .result-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-bottom:9px;margin-bottom:12px;border-bottom:1px solid var(--line-2);
  }
  .result-head h2{
    margin:0;font-size:12px;font-weight:800;letter-spacing:.12em;
    display:flex;align-items:center;gap:7px;
  }
  .result-head h2::before{content:"";width:3px;height:14px;background:var(--gold);display:inline-block}
  .result-head h2 small{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted);font-weight:700}
  .tools{display:flex;gap:6px;align-items:center}
  .btn{
    font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;
    color:var(--ink);background:transparent;
    border:1px solid var(--line-2);border-radius:1px;
    padding:6px 10px;cursor:pointer;text-decoration:none;white-space:nowrap;
  }
  .btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#16130a}
  .btn:active{transform:translateY(1px)}
  .shot{
    background:#fff;overflow:auto;-webkit-overflow-scrolling:touch;
    text-align:center;padding:2px 0;
    margin:0 -16px;
  }
  .shot img{display:none;width:100%;max-width:none;vertical-align:top}
  .shot img.show{display:block}
  .shot.zoomed img{width:180%}
  .empty{
    margin:0;padding:34px 12px;color:var(--muted);
    font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-align:center;
  }
  .empty::before{content:"> ";color:var(--gold-2)}
  .foot{
    max-width:640px;margin:0 auto;padding:0 16px 26px;
    display:flex;justify-content:space-between;gap:10px;
    font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted);opacity:.8;
  }
</style>
</head>
